name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows — full verify (syntax + imports + python + unit + provider + smoke)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python dependencies
        run: python -m pip install --disable-pip-version-check -r provider/requirements.txt

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax gate
        run: npm run check:syntax

      - name: Import graph gate
        run: npm run check:imports

      - name: Python provider gate
        run: npm run check:py

      - name: Unit gate
        run: npm run test:unit

      - name: Core coverage report (src/core)
        run: npm run report:core-coverage -- --min 80

      - name: Pine corpus cost budget (ROUND281)
        run: npm run check:pine-budget

      - name: Provider harness gate (replayable MT5 fake)
        run: npm run check:mt5

      - name: Boot smoke (demo provider + offscreen Electron)
        run: npm run smoke

      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshot-windows
          path: docs/_smoke.png
          if-no-files-found: ignore

  linux:
    name: Linux — full verify (real Electron smoke under Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python dependencies
        run: python -m pip install --disable-pip-version-check -r provider/requirements.txt

      # Electron still needs a display even with an offscreen window; Xvfb
      # provides one. GTK/ATK/ALSA/CUPS were t64-renamed on Ubuntu 24.04, so
      # fall back to the 22.04 names if the t64 packages are unavailable.
      - name: Electron runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libnss3 libgbm1 libxss1 libxtst6
          sudo apt-get install -y --no-install-recommends \
            libatk-bridge2.0-0t64 libgtk-3-0t64 libasound2t64 libcups2t64 \
            || sudo apt-get install -y --no-install-recommends \
            libatk-bridge2.0-0 libgtk-3-0 libasound2 libcups2

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Full gate under Xvfb
        run: xvfb-run --auto-servernum --server-args="-screen 0 1600x900x24" npm run verify

      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshot-linux
          path: docs/_smoke.png
          if-no-files-found: ignore

  macos:
    name: macOS — full verify (native offscreen Electron smoke)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python dependencies
        run: python -m pip install --disable-pip-version-check -r provider/requirements.txt

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Full gate
        run: npm run verify

      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshot-macos
          path: docs/_smoke.png
          if-no-files-found: ignore
