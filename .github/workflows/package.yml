name: Package

# Builds the platform installers on demand and on release tags.
# The regular CI workflow (`ci.yml`) stays the fast quality gate; packaging
# is the expensive, artifact-producing half and runs only when a release is
# being cut (tag `v*`) or when triggered manually.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  # ROUND290: `contents: write` is required to create the GitHub Release the
  # in-app updater reads (latest.yml + the installers). Before this the job
  # only uploaded a 14-day artifact, so there was nothing to update FROM.
  contents: write

env:
  # Never look for a local signing identity on the runner. Set CSC_LINK /
  # CSC_KEY_PASSWORD (and the Apple notarization secrets) as repository
  # secrets to produce signed builds — see README "Code signing".
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows installer
            os: windows-latest
            script: dist:win
            artifact: OJchart-windows
            files: dist/*.exe
            checksum: '*.exe'
          - name: macOS installer
            os: macos-latest
            script: dist:mac
            artifact: OJchart-macos
            files: dist/*.dmg
            checksum: '*.dmg'
          - name: Linux installer
            os: ubuntu-latest
            script: dist:linux
            artifact: OJchart-linux
            files: dist/*.AppImage
            checksum: '*.AppImage'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build installer
        run: npm run ${{ matrix.script }} -- --publish never

      - name: Checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii

      - name: Checksums (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd dist
          # Only glob this platform's own installer; a combined *.dmg *.AppImage
          # pattern fails with "No such file or directory" on the other OS.
          shasum -a 256 ${{ matrix.checksum }} > SHA256SUMS.txt

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.files }}
            dist/*.yml
            dist/*.blockmap
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        shell: bash
        run: |
          echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat dist/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh dist/*.exe dist/*.dmg dist/*.AppImage 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true

  # ROUND290 — publish a real GitHub Release.
  #
  # Why a separate job: the three platform builds run in parallel and each can
  # only see its OWN output. An update feed (`latest.yml` on Windows,
  # `latest-mac.yml`, `latest-linux.yml`) plus three installer assets must land
  # on ONE release, so a job that `needs: package` downloads all three
  # artifacts and creates the release once.
  #
  # Until ROUND290 the installers only existed as workflow artifacts, which
  # expire after 14 days and are invisible to users and to electron-updater —
  # so a released app had no way to learn a newer build existed.
  release:
    name: GitHub Release
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Collect release files
        shell: bash
        run: |
          cd assets
          ls -lh
          # Only the installer + update-feed files belong on the release page.
          mkdir -p ../out
          for f in *.exe *.dmg *.AppImage *.yml *.blockmap; do
            [ -e "$f" ] && cp "$f" ../out/ || true
          done
          cd ../out && ls -lh

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OJchart ${{ github.ref_name }}
          draft: false
          prerelease: false
          # A missing note is fine — an empty body beats a failed release.
          generate_release_notes: true
          files: out/*
          fail_on_unmatched_files: false
